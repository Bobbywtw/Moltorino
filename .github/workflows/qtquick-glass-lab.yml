name: Moltorino Fast Glass Checks
on:
  push:
    branches:
      - qtquick-liquid-glass-01
      - liquid-glass-integration-01
      - moltorino-build-optimization-01
    paths:
      - "tools/glass-lab/**"
      - "!tools/glass-lab/qml/GlassIntegrationPreview.qml"
      - ".github/workflows/qtquick-glass-lab.yml"
      - ".CI/verify-glass-lab.ps1"
      - ".CI/glass-lab-checks.cpp"
      - ".CI/reuse-composer-package.ps1"
  workflow_dispatch:
  workflow_call:

env:
  QT_VERSION: 6.9.3

jobs:
  shader-preview-windows:
    name: QML, QSB, GPU and composer checks
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1

      - name: Install Qt 6.9.3 ShaderTools
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtimageformats qtshadertools
          cache: true
          cache-key-prefix: Windows-QtCache-6.9.3-v2

      - name: Enable MSVC compiler
        uses: Chatterino/msvc-dev-cmd@v2.0.5
        with:
          arch: x64

      - name: Configure standalone lab
        shell: pwsh
        run: |
          cmake -S tools/glass-lab -B build/glass-lab -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw 'Lab CMake configure failed' }

      - name: Compile Qt Quick and QSB shaders
        shell: pwsh
        run: |
          cmake --build build/glass-lab --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Lab shader compilation failed' }

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build/glass-lab-dist -Force | Out-Null
          Copy-Item build/glass-lab/MoltorinoGlassLab.exe build/glass-lab-dist/
          Copy-Item build/glass-lab/MoltorinoGlassChecks.exe build/glass-lab-dist/
          windeployqt build/glass-lab-dist/MoltorinoGlassLab.exe --release --qmldir tools/glass-lab/qml --dir build/glass-lab-dist --no-compiler-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Qt deployment failed' }

      - name: Validate QML components and actual GPU rendering
        shell: pwsh
        run: .\.CI\verify-glass-lab.ps1 -BuildDirectory build/glass-lab-dist

      - name: Locate a compatible verified application
        id: verified-app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\.CI\reuse-composer-package.ps1 Resolve

      - name: Download full-build provenance
        if: steps.verified-app.outputs.run_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Moltorino-Build-Metadata
          run-id: ${{ steps.verified-app.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build/reusable-package/metadata

      - name: Download verified executable
        if: steps.verified-app.outputs.run_id != ''
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Moltorino-Windows
          run-id: ${{ steps.verified-app.outputs.run_id }}
          github-token: ${{ github.token }}
          path: build/reusable-package/package

      - name: Verify actual resized composer without recompiling the app
        if: steps.verified-app.outputs.run_id != ''
        shell: pwsh
        env:
          VERIFIED_RUN_ID: ${{ steps.verified-app.outputs.run_id }}
          VERIFIED_SOURCE_COMMIT: ${{ steps.verified-app.outputs.source_commit }}
        run: .\.CI\reuse-composer-package.ps1 Verify

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Moltorino-GPU-Glass-Lab-Review
          path: build/lab-review/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload standalone lab
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Moltorino-GPU-Glass-Lab-Windows
          path: build/glass-lab-dist/
          if-no-files-found: error
          retention-days: 14
