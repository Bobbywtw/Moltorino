name: Glass UI Windows Test

on:
  push:
    branches:
      - glass-ui-pass-01
  workflow_dispatch:

env:
  CONAN_VERSION: 2.28.1

jobs:
  build-windows:
    name: Build Glass UI - Windows x64
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          cache: true
          cache-key-prefix: Windows-QtCache-6.9.3-v2
          modules: qtimageformats
          version: 6.9.3

      - name: Enable Developer Command Prompt
        uses: Chatterino/msvc-dev-cmd@v2.0.5
        with:
          arch: x64

      - name: Prepare persistent sccache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:SCCACHE_DIR -Force | Out-Null
          Write-Output "SCCACHE_DIR=$env:SCCACHE_DIR"

      - name: Setup sccache
        id: sccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache
          save: true
          max-size: 2G
          key: sccache-graphite-windows2022-x64-6.9.3-no-pch-v2

      - name: Cache Conan packages
        id: conan-cache
        uses: actions/cache/restore@v5
        with:
          key: Windows2022-X64-conan-user-${{ hashFiles('**/conanfile.py') }}-QT6-libwebm-conforming-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: Windows2022-X64-conan-user-${{ hashFiles('**/conanfile.py') }}-QT6-libwebm-conforming-
          path: ~/.conan2/

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install and setup Conan
        shell: bash
        run: |
          pip install conan==${CONAN_VERSION}
          conan --version
          conan profile detect -f

      - name: Install dependencies
        id: dependencies
        shell: bash
        env:
          # Keep Conan's tool PATH when libvpx invokes MSBuild (yasm lives there).
          UseEnv: "true"
        run: |
          mkdir build
          cd build
          # libwebm's nested MasterValueParser lookup needs conforming MSVC lookup.
          # A relative metadata path also works for native pkgconf inside MSYS.
          conan install .. \
              -s build_type=RelWithDebInfo \
              -c tools.cmake.cmaketoolchain:generator="Ninja" \
              -c 'libwebm/*:tools.build:cxxflags=["/permissive-"]' \
              -c 'ffmpeg/*:tools.gnu:extra_configure_args=["--env=PKG_CONFIG_PATH=conan"]' \
              -b missing \
              -c tools.build:jobs=4 \
              --output-folder=. \
              -o with_openssl3=True
          conan cache clean --source --build --download "*"

      - name: Show FFmpeg configure failure
        if: failure() && steps.dependencies.outcome == 'failure'
        shell: pwsh
        run: |
          Get-ChildItem "$env:USERPROFILE/.conan2/p/b" -Filter config.log -Recurse |
            Where-Object { $_.FullName -match 'ffbuild[\\/]config\.log$' } |
            ForEach-Object {
              Write-Output "FFmpeg configure log: $($_.FullName)"
              Get-Content $_.FullName -Tail 160
            }

      - name: Save Conan packages
        if: always() && steps.conan-cache.outcome == 'success' && steps.dependencies.outcome != 'skipped'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
          path: ~/.conan2/

      - name: Build Moltorino
        shell: pwsh
        run: |
          cd build
          # MSVC /Fp and /Yc are not cacheable; compile without PCH for sccache.
          cmake `
              -G Ninja `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
              -DUSE_PRECOMPILED_HEADERS=Off `
              -DBUILD_WITH_CRASHPAD=Off `
              -DCHATTERINO_LTO=On `
              -DFORCE_JSON_GENERATION=Off `
              -DCHATTERINO_NIGHTLY_BUILD=Off `
              -DCHATTERINO_SPELLCHECK=On `
              -DMOLTORINO_VELOPACK=Off `
              ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          # Verify real project compiler arguments before the expensive full build.
          cmake --build . --target src/CMakeFiles/chatterino-lib-version.dir/common/Version.cpp.obj --verbose
          if ($LASTEXITCODE -ne 0) { throw "Version object compilation failed" }
          sccache --show-stats
          if (@(Get-ChildItem $env:SCCACHE_DIR -File -Recurse).Count -eq 0) {
            throw "The real project compile is not writing compiler cache data"
          }
          cmake --build . --parallel 4

      - name: Verify compiler cache data
        if: always() && steps.sccache.outcome == 'success'
        shell: pwsh
        run: |
          Write-Output "SCCACHE_DIR=$env:SCCACHE_DIR"
          sccache --show-stats
          if (!(Test-Path -Path $env:SCCACHE_DIR -PathType Container)) {
            throw "sccache directory disappeared before post-job save"
          }
          $files = @(Get-ChildItem $env:SCCACHE_DIR -File -Recurse)
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Output "sccache disk entries=$($files.Count), bytes=$bytes"
          if ($files.Count -eq 0 -or $bytes -eq 0) {
            throw "No compiler cache data was written to SCCACHE_DIR"
          }

      - name: Prepare Windows ZIP build
        working-directory: build
        shell: pwsh
        run: |
          New-Item -ItemType Directory Moltorino-Glass -Force | Out-Null
          Copy-Item bin/* Moltorino-Glass/ -Recurse -Exclude *.pdb
          windeployqt Moltorino-Glass/Moltorino7.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --dir Moltorino-Glass/ --force-openssl
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          ..\.CI\deploy-crt.ps1 Moltorino-Glass -Architecture x64
          if ($LASTEXITCODE -ne 0) { throw "CRT deployment failed" }
          ..\.CI\deploy-crt.ps1 Moltorino-Glass/support/media -Architecture x64
          if ($LASTEXITCODE -ne 0) { throw "Media CRT deployment failed" }
          7z a Moltorino-Windows.zip Moltorino-Glass/
          if ($LASTEXITCODE -ne 0) { throw "ZIP creation failed" }

      - name: Verify Windows package
        working-directory: build
        shell: pwsh
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP 'glass-portable-check'
          Expand-Archive Moltorino-Windows.zip -DestinationPath $verifyDir
          $packageDir = Join-Path $verifyDir 'Moltorino-Glass'
          foreach ($file in @('Moltorino7.exe', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Network.dll', 'Qt6Sql.dll', 'platforms/qwindows.dll', 'sqldrivers/qsqlite.dll', 'tls/qopensslbackend.dll', 'libssl-3-x64.dll', 'libcrypto-3-x64.dll', 'support/media/ffmpeg.exe', 'support/media/ffprobe.exe', 'support/7zip/7z.exe', 'support/7zip/7z.dll')) {
            if (!(Test-Path (Join-Path $packageDir $file))) { throw "Missing portable file: $file" }
          }
          # Each executable must resolve its VC runtime without a system install.
          foreach ($executable in Get-ChildItem $packageDir -Recurse -Filter *.exe) {
            $imports = & dumpbin /DEPENDENTS $executable.FullName
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $($executable.Name)" }
            foreach ($line in $imports) {
              if ($line -match '^\s*((?:MSVCP|VCRUNTIME)[\w_]*\.dll)\s*$') {
                if (!(Test-Path (Join-Path $executable.DirectoryName $Matches[1]))) {
                  throw "Missing local $($Matches[1]) for $($executable.FullName)"
                }
              }
            }
          }
          # Launch the extracted package without Qt, Conan or MSVC tools on PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_PLUGIN_PATH = $packageDir
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $packageDir 'platforms'
          Push-Location $verifyDir
          foreach ($program in @(@('Moltorino7.exe', '--version'), @('support/media/ffmpeg.exe', '-version'), @('support/media/ffprobe.exe', '-version'))) {
            $process = Start-Process -FilePath (Join-Path $packageDir $program[0]) -ArgumentList $program[1] -PassThru -NoNewWindow
            if (!$process.WaitForExit(30000)) {
              $process.Kill()
              throw "Portable launch timed out: $($program[0])"
            }
            if ($process.ExitCode -ne 0) { throw "Portable launch failed: $($program[0]) ($($process.ExitCode))" }
          }
          Pop-Location
          ..\.CI\verify-glass-ui.ps1 -PackageDirectory $packageDir -ReviewDirectory (Join-Path $env:GITHUB_WORKSPACE 'build/ui-review')

      - name: Upload native UI review
        uses: actions/upload-artifact@v7
        with:
          name: Moltorino-UI-Review
          path: build/ui-review/
          overwrite: true
          retention-days: 14

      - name: Upload Glass UI Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Moltorino-Windows
          overwrite: true
          path: build/Moltorino-Windows.zip
          retention-days: 14
