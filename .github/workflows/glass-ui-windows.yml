name: Glass UI Windows Test

on:
  push:
    branches:
      - glass-ui-pass-01
      - liquid-glass-plugin-01
      - liquid-glass-integration-01
      - moltorino-build-optimization-01
    paths:
      - "**"
      - "!tools/glass-lab/**"
      - "!docs/**"
      - "!.github/workflows/qtquick-glass-lab.yml"
      - "!.CI/verify-glass-lab.ps1"
      - "!.CI/glass-lab-checks.cpp"
      - "!.CI/reuse-composer-package.ps1"
      # The scene embedded by the native integration requires the full app.
      - "tools/glass-lab/qml/GlassIntegrationPreview.qml"
  workflow_dispatch:
    inputs:
      development_build:
        description: 'Disposable app check (LTO off; not a production artifact)'
        type: boolean
        default: false
      benchmark_parallelism:
        description: 'Measure four versus six jobs on real C++ objects'
        type: boolean
        default: false

concurrency:
  group: moltorino-windows-full-${{ github.ref }}
  cancel-in-progress: false

env:
  CONAN_VERSION: 2.28.1
  QT_VERSION: 6.9.3

jobs:
  fast-glass-checks:
    uses: ./.github/workflows/qtquick-glass-lab.yml

  build-windows:
    name: Build Glass UI - Windows x64
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G
      CONAN_HOME: ${{ github.workspace }}\.conan2
      CONAN_NON_INTERACTIVE: '1'
      APP_BUILD_JOBS: 6
      BUILD_LTO: ${{ inputs.development_build && 'Off' || 'On' }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          cache: true
          cache-key-prefix: Windows-QtCache-6.9.3-v2
          modules: qtimageformats qtshadertools
          version: ${{ env.QT_VERSION }}

      - name: Enable Developer Command Prompt
        uses: Chatterino/msvc-dev-cmd@v2.0.5
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install and identify Conan toolchain
        id: toolchain
        shell: pwsh
        run: |
          pip install conan==$env:CONAN_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Conan installation failed' }
          conan profile detect -f
          if ($LASTEXITCODE -ne 0) { throw 'Compiler detection failed' }
          $compiler = (Get-Item (Get-Command cl.exe).Source).VersionInfo.FileVersion
          $profile = Get-Content (Join-Path $env:CONAN_HOME 'profiles/default') -Raw
          $inputs = "$compiler|$env:WindowsSDKVersion|$env:QT_VERSION|$env:CONAN_VERSION|$profile"
          foreach ($file in @('conanfile.py', '.CI/windows-conan.profile')) { $inputs += Get-Content $file -Raw }
          $fingerprint = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($inputs))).ToLower()
          "fingerprint=$fingerprint" >> $env:GITHUB_OUTPUT
          Write-Output "Compiler=$compiler; SDK=$env:WindowsSDKVersion; Qt=$env:QT_VERSION; cache fingerprint=$fingerprint"
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory | Format-List
          New-Item -ItemType Directory $env:SCCACHE_DIR -Force | Out-Null
          Write-Output "SCCACHE_DIR=$env:SCCACHE_DIR"

      - name: Setup sccache
        id: sccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          variant: sccache
          restore: false
          save: false
          max-size: 2G

      - name: Stop empty compiler cache server before restoring files
        shell: pwsh
        run: |
          if (Get-Process sccache -ErrorAction SilentlyContinue) {
            sccache --stop-server
            if ($LASTEXITCODE -ne 0) { throw 'Could not stop sccache before loading its disk cache' }
          }

      - name: Restore compiler base
        id: compiler-base
        uses: actions/cache/restore@v5
        with:
          key: win-sccache-base-v1-${{ steps.toolchain.outputs.fingerprint }}-${{ env.BUILD_LTO }}
          path: ${{ env.SCCACHE_DIR }}

      - name: Record compiler base entries
        shell: pwsh
        run: .\.CI\compiler-cache.ps1 Snapshot

      - name: Restore changed compiler entries
        if: steps.compiler-base.outputs.cache-hit == 'true'
        id: compiler-overlay
        uses: actions/cache/restore@v5
        with:
          key: win-sccache-overlay-v1-${{ steps.toolchain.outputs.fingerprint }}-${{ env.BUILD_LTO }}-${{ github.sha }}
          restore-keys: win-sccache-overlay-v1-${{ steps.toolchain.outputs.fingerprint }}-${{ env.BUILD_LTO }}-
          path: .sccache-overlay

      - name: Apply changed compiler entries
        shell: pwsh
        run: .\.CI\compiler-cache.ps1 Overlay

      - name: Cache Conan packages
        id: conan-cache
        uses: actions/cache/restore@v5
        with:
          key: win-conan-v1-${{ steps.toolchain.outputs.fingerprint }}
          path: ${{ env.CONAN_HOME }}

      - name: Install dependencies
        id: dependencies
        shell: bash
        env:
          # Keep Conan's tool PATH when libvpx invokes MSBuild (yasm lives there).
          UseEnv: "true"
        run: |
          mkdir build
          cd build
          # libwebm's nested MasterValueParser lookup needs conforming MSVC lookup.
          # A relative metadata path also works for native pkgconf inside MSYS.
          python ../.CI/time-command.py --name conan --output metrics/conan.json -- conan install .. \
              -pr:h default -pr:h ../.CI/windows-conan.profile \
              -b missing --output-folder=. -o with_openssl3=True \
              --lockfile-out=conan.lock --format=json --out-file=conan-install.json
          if [ $? -ne 0 ]; then exit 1; fi
          conan cache clean --source --build --download "*"

      - name: Show FFmpeg configure failure
        if: failure() && steps.dependencies.outcome == 'failure'
        shell: pwsh
        run: |
          Get-ChildItem "$env:CONAN_HOME/p/b" -Filter config.log -Recurse |
            Where-Object { $_.FullName -match 'ffbuild[\\/]config\.log$' } |
            ForEach-Object {
              Write-Output "FFmpeg configure log: $($_.FullName)"
              Get-Content $_.FullName -Tail 160
            }

      - name: Save Conan packages
        if: steps.dependencies.outcome == 'success' && steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
          path: ${{ env.CONAN_HOME }}

      - name: Build Moltorino
        shell: pwsh
        run: |
          cd build
          # MSVC /Fp and /Yc are not cacheable; compile without PCH for sccache.
          python ../.CI/time-command.py --name configure --output metrics/configure.json -- cmake `
              -G Ninja `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
              -DUSE_PRECOMPILED_HEADERS=Off `
              -DBUILD_WITH_CRASHPAD=Off `
              -DCHATTERINO_LTO=$env:BUILD_LTO `
              -DCMAKE_EXPORT_COMPILE_COMMANDS=On `
              -DFORCE_JSON_GENERATION=Off `
              -DCHATTERINO_NIGHTLY_BUILD=Off `
              -DCHATTERINO_SPELLCHECK=On `
              -DMOLTORINO_VELOPACK=Off `
              -DMOLTORINO_GLASS_QUICK_PREVIEW=On `
              ..
          if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
          # Verify real project compiler arguments before the expensive full build.
          cmake --build . --target src/CMakeFiles/chatterino-lib-version.dir/common/Version.cpp.obj --verbose
          if ($LASTEXITCODE -ne 0) { throw "Version object compilation failed" }
          sccache --show-stats
          if (@(Get-ChildItem $env:SCCACHE_DIR -File -Recurse).Count -eq 0) {
            throw "The real project compile is not writing compiler cache data"
          }
          python ../.CI/time-command.py --name app --output metrics/app.json -- cmake --build . --parallel $env:APP_BUILD_JOBS
          if ($LASTEXITCODE -ne 0) { throw 'Application compilation/linking failed' }
          cd ..
          python .CI/ninja-metrics.py
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read native compiler/link measurements' }

      - name: Verify compiler cache data
        if: always() && steps.sccache.outcome == 'success'
        shell: pwsh
        run: |
          Write-Output "SCCACHE_DIR=$env:SCCACHE_DIR"
          sccache --show-stats | Tee-Object build/metrics/sccache.txt
          if (!(Test-Path -Path $env:SCCACHE_DIR -PathType Container)) {
            throw "sccache directory disappeared before post-job save"
          }
          $files = @(Get-ChildItem $env:SCCACHE_DIR -File -Recurse)
          $bytes = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Output "sccache disk entries=$($files.Count), bytes=$bytes"
          if ($files.Count -eq 0 -or $bytes -eq 0) {
            throw "No compiler cache data was written to SCCACHE_DIR"
          }

      - name: Save compiler base
        if: steps.compiler-base.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.compiler-base.outputs.cache-primary-key }}
          path: ${{ env.SCCACHE_DIR }}

      - name: Prepare changed compiler cache
        if: steps.compiler-base.outputs.cache-hit == 'true'
        id: compiler-delta
        shell: pwsh
        run: .\.CI\compiler-cache.ps1 Stage

      - name: Save changed compiler cache
        if: steps.compiler-delta.outputs.entries != '0' && steps.compiler-delta.outcome == 'success' && steps.compiler-overlay.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ${{ steps.compiler-overlay.outputs.cache-primary-key }}
          path: .sccache-overlay

      - name: Prepare Windows ZIP build
        working-directory: build
        shell: pwsh
        run: |
          $packageTimer = [Diagnostics.Stopwatch]::StartNew()
          New-Item -ItemType Directory Moltorino-Glass -Force | Out-Null
          Copy-Item bin/* Moltorino-Glass/ -Recurse -Exclude *.pdb
          windeployqt Moltorino-Glass/Moltorino7.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --qmldir ../tools/glass-lab/qml --dir Moltorino-Glass/ --force-openssl
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }
          ..\.CI\deploy-crt.ps1 Moltorino-Glass -Architecture x64
          if ($LASTEXITCODE -ne 0) { throw "CRT deployment failed" }
          ..\.CI\deploy-crt.ps1 Moltorino-Glass/support/media -Architecture x64
          if ($LASTEXITCODE -ne 0) { throw "Media CRT deployment failed" }
          7z a Moltorino-Windows.zip Moltorino-Glass/
          if ($LASTEXITCODE -ne 0) { throw "ZIP creation failed" }
          @{ stage = 'package'; seconds = [Math]::Round($packageTimer.Elapsed.TotalSeconds, 3); exitCode = 0 } | ConvertTo-Json | Set-Content metrics/package.json

      - name: Prepare native crash diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory build/diagnostics -Force | Out-Null
          cl.exe /nologo /EHsc /std:c++20 /MT .CI/debug-windows-startup.cpp /Febuild/diagnostics/debug-windows-startup.exe /Fobuild/diagnostics/debug-windows-startup.obj /link dbghelp.lib
          if ($LASTEXITCODE -ne 0) { throw "Cannot build native startup diagnostics" }

      - name: Verify Windows package
        working-directory: build
        shell: pwsh
        run: |
          $verifyDir = Join-Path $env:RUNNER_TEMP 'glass-portable-check'
          Expand-Archive Moltorino-Windows.zip -DestinationPath $verifyDir
          $packageDir = Join-Path $verifyDir 'Moltorino-Glass'
          foreach ($file in @('Moltorino7.exe', 'Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll', 'Qt6Network.dll', 'Qt6Sql.dll', 'platforms/qwindows.dll', 'sqldrivers/qsqlite.dll', 'tls/qopensslbackend.dll', 'libssl-3-x64.dll', 'libcrypto-3-x64.dll', 'support/media/ffmpeg.exe', 'support/media/ffprobe.exe', 'support/7zip/7z.exe', 'support/7zip/7z.dll')) {
            if (!(Test-Path (Join-Path $packageDir $file))) { throw "Missing portable file: $file" }
          }
          if (!(Test-Path (Join-Path $packageDir 'glass/moltorino-liquid-glass.dll'))) { throw "Missing native glass plugin DLL" }
          # Each executable must resolve its VC runtime without a system install.
          foreach ($executable in Get-ChildItem $packageDir -Recurse -Filter *.exe) {
            $imports = & dumpbin /DEPENDENTS $executable.FullName
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $($executable.Name)" }
            foreach ($line in $imports) {
              if ($line -match '^\s*((?:MSVCP|VCRUNTIME)[\w_]*\.dll)\s*$') {
                if (!(Test-Path (Join-Path $executable.DirectoryName $Matches[1]))) {
                  throw "Missing local $($Matches[1]) for $($executable.FullName)"
                }
              }
            }
          }
          # Launch the extracted package without Qt, Conan or MSVC tools on PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:QT_PLUGIN_PATH = $packageDir
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = Join-Path $packageDir 'platforms'
          Push-Location $verifyDir
          foreach ($program in @(@('Moltorino7.exe', '--version'), @('support/media/ffmpeg.exe', '-version'), @('support/media/ffprobe.exe', '-version'))) {
            $process = Start-Process -FilePath (Join-Path $packageDir $program[0]) -ArgumentList $program[1] -PassThru -NoNewWindow
            if (!$process.WaitForExit(30000)) {
              $process.Kill()
              throw "Portable launch timed out: $($program[0])"
            }
            if ($process.ExitCode -ne 0) { throw "Portable launch failed: $($program[0]) ($($process.ExitCode))" }
          }
          Pop-Location
          ..\.CI\verify-glass-ui.ps1 -PackageDirectory $packageDir -ReviewDirectory (Join-Path $env:GITHUB_WORKSPACE 'build/ui-review')

      - name: Upload startup diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Moltorino-Startup-Diagnostics
          path: build/ui-review/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Upload native UI review
        uses: actions/upload-artifact@v7
        with:
          name: Moltorino-UI-Review
          path: build/ui-review/
          overwrite: true
          retention-days: 14

      - name: Record verified build inputs
        shell: pwsh
        run: |
          python .CI/build-fingerprint.py build/build-source.json
          if ($env:BUILD_LTO -ne 'On') {
            $metadata = Get-Content build/build-source.json -Raw | ConvertFrom-Json
            $metadata.lto = $false
            $metadata | ConvertTo-Json | Set-Content build/build-source.json
          }

      - name: Benchmark compiler parallelism
        if: inputs.benchmark_parallelism || contains(github.event.head_commit.message, '[benchmark-build]')
        shell: pwsh
        run: .\.CI\benchmark-parallel.ps1

      - name: Summarize measured build stages
        shell: pwsh
        run: python .CI/summarize-build.py

      - name: Upload build measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Moltorino-Build-Metadata
          path: |
            build/build-source.json
            build/metrics/
            build/conan.lock
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Glass UI Windows build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.development_build && 'Moltorino-Development-Windows' || 'Moltorino-Windows' }}
          overwrite: true
          path: build/Moltorino-Windows.zip
          retention-days: 14
